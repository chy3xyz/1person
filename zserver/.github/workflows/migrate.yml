name: migrate

on:
  push:
    branches: [main]
    paths:
      - 'zserver/**'
      - 'server/migrations/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zserver/**'
      - 'server/migrations/**'
      - 'docker-compose.yml'
  workflow_dispatch:

# Reuse CI concurrency group so PRs cancel in-progress duplicates.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    # Spins up a Postgres service container matching the Go backend CI
    # (../.github/workflows/ci.yml), runs zserver migrate twice to
    # verify idempotency, then re-runs zig build test to catch regressions
    # introduced by the migrate.zig changes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      # zigup installs into ~/.local/bin; prepend it to PATH.
      PATH: ${{ env.PATH }}:${{ github.workspace }}/.zigup/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig 0.17.0-dev.813
        # Pinned to match the local development toolchain. If the pinned
        # build ever disappears from zigup, update to `zigup install latest`
        # and document the new commit hash here.
        run: |
          mkdir -p .zigup/bin
          curl -fsSL https://raw.githubusercontent.com/marlonrichie/zigup/master/install.sh \
            | bash -s -- --prefix "${GITHUB_WORKSPACE}/.zigup"
          "${GITHUB_WORKSPACE}/.zigup/bin/zigup" install 0.17.0-dev.813+2153f8143
          "${GITHUB_WORKSPACE}/.zigup/bin/zigup" default 0.17.0-dev.813+2153f8143
          zig version

      - name: Cache libpq + zig build cache
        # Caching speeds up repeated runs; key is invalidated when
        # build.zig, build.zig.zon or any src/*.zig file changes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zserver/.zig-cache
            /usr/local/lib/libpq*
          key: zig-migrate-${{ hashFiles('zserver/build.zig', 'zserver/build.zig.zon', 'zserver/src/**/*.zig') }}
          restore-keys: |
            zig-migrate-

      - name: Install libpq headers (Postgres client lib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Build zserver
        run: cd zserver && zig build

      - name: Run migrations
        run: cd zserver && ./zig-out/bin/zserver migrate --db-url "$DATABASE_URL"

      - name: Re-run migrations (idempotency)
        # schema_migrations records every applied file, so the second run
        # should be a no-op (skipped count == file count, applied == 0).
        run: cd zserver && ./zig-out/bin/zserver migrate --db-url "$DATABASE_URL"

      - name: zig build test
        run: cd zserver && zig build test

      - name: make ci (best-effort db-up + db-migrate + check)
        # Runs the local CI pipeline against the same DATABASE_URL the GitHub
        # Postgres service exposes. db-up is skipped (docker isn't usable
        # here), db-migrate reuses the existing schema, and check re-runs
        # `zig build && zig build test` so any Makefile-level regressions
        # are caught before they reach PRs.
        run: cd zserver && make ci
