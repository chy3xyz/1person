name: 1person

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: 1person
      POSTGRES_USER: ${POSTGRES_USER:-1person}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1person}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
