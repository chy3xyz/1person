name: Migrate (zserver)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migrate:
    # Verifies that `zserver migrate` applies every zserver/migrations/*.up.sql
    # against a fresh Postgres and stays idempotent on a second run. This
    # exercises the same code path CI uses for the Go server, but for the Zig
    # rewrite that depends on zfinal/zcli via zig_ws/zfinal.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig (pinned 0.17.0-dev.1567)
        run: |
          set -euo pipefail
          bash zserver/scripts/install-zig.sh "${GITHUB_WORKSPACE}/.zig"
          echo "${GITHUB_WORKSPACE}/.zig" >> "${GITHUB_PATH}"

      - name: Show Zig version
        run: zig version

      - name: Provision zig deps (pinned zfinal + zcli)
        # build.zig.zon resolves zfinal/zcli to <repo>/zig_ws; a clean
        # checkout has neither, so provision them before building.
        run: bash zserver/scripts/provision-zig-deps.sh

      - name: Build
        # libpq headers are required by build.zig (pq C shim).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev
          cd zserver
          zig build

      - name: Run migrations
        working-directory: zserver
        run: ./scripts/db-migrate.sh

      - name: Re-run migrations (idempotency check)
        working-directory: zserver
        run: ./scripts/db-migrate.sh