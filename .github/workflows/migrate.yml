name: Migrate (zserver)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migrate:
    # Verifies that `zserver migrate` applies every backend/zserver/migrations/*.up.sql
    # against a fresh Postgres and stays idempotent on a second run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig (pinned 0.17.0-dev.1567)
        run: |
          set -euo pipefail
          bash backend/zserver/scripts/install-zig.sh "${GITHUB_WORKSPACE}/.zig"
          echo "${GITHUB_WORKSPACE}/.zig" >> "${GITHUB_PATH}"

      - name: Show Zig version
        run: zig version

      - name: Build
        # libpq headers are required by build.zig (pq C shim).
        # zfinal/zcli are fetched by zig from build.zig.zon git URLs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev
          cd backend/zserver
          zig build

      - name: Run migrations
        working-directory: backend/zserver
        run: ./scripts/db-migrate.sh

      - name: Re-run migrations (idempotency check)
        working-directory: backend/zserver
        run: ./scripts/db-migrate.sh
