name: zserver CI

# zserver (Zig backend) build + test + migration + e2e gate.
#
# Lives at the repo root because GitHub Actions ignores workflows in
# nested .github directories. zfinal + zcli are Zig package manager git
# deps in backend/zserver/build.zig.zon (fetched by `zig build`).

on:
  push:
    branches: [main]
    paths:
      - "backend/zserver/**"
      - ".github/workflows/zserver-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/zserver/**"
      - ".github/workflows/zserver-ci.yml"
  workflow_dispatch:

concurrency:
  group: zserver-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/zserver
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: 1person
          POSTGRES_USER: 1person
          POSTGRES_PASSWORD: 1person
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 1person -d 1person"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://1person:1person@localhost:5432/1person?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig (pinned 0.17.0)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash backend/zserver/scripts/install-zig.sh "${GITHUB_WORKSPACE}/.zig"
          # GITHUB_PATH is the only way to extend PATH for later steps. A
          # job-level `PATH: ${{ env.PATH }}` is not an option: the `env`
          # context is unavailable at `jobs.<id>.env`, which made this
          # workflow fail to parse — and so never run at all.
          echo "${GITHUB_WORKSPACE}/.zig" >> "${GITHUB_PATH}"

      - name: Show Zig version
        run: zig version

      - name: Install libpq headers (Postgres client lib)
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq
          # postgresql-client: the e2e scripts seed fixtures with `psql`.
          sudo apt-get install -y -qq libpq-dev postgresql-client

      - name: Build
        run: zig build

      - name: Migrations (apply + idempotency)
        run: |
          ./zig-out/bin/zserver migrate
          echo "==> re-run (idempotency check)"
          ./zig-out/bin/zserver migrate

      - name: Unit tests
        run: zig build test

      - name: E2E — issue suite, no-DB mode
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 DATABASE_URL="" \
            bash scripts/issue_e2e.sh

      - name: E2E — issue suite, DB mode
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/issue_e2e.sh

      - name: E2E — agent suite, no-DB mode
        # The agent suite covers the read gate: an agent of another
        # workspace must not be readable, and a private agent must not
        # be readable by a plain member of the same workspace. The
        # second half needs a second member, which the no-DB mode
        # cannot hold — the script warns and skips it there.
        # The cache paths point at the one the Build step warmed, so
        # the build inside the script stays incremental.
        run: |
          ZIG_E2E_LOCAL_CACHE="${GITHUB_WORKSPACE}/backend/zserver/.zig-cache" \
          ZIG_E2E_GLOBAL_CACHE="${HOME}/.cache/zig" \
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 DATABASE_URL="" \
            bash scripts/agent_e2e.sh

      - name: E2E — agent suite, DB mode
        run: |
          ZIG_E2E_LOCAL_CACHE="${GITHUB_WORKSPACE}/backend/zserver/.zig-cache" \
          ZIG_E2E_GLOBAL_CACHE="${HOME}/.cache/zig" \
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/agent_e2e.sh

      - name: E2E — runtime suite (DB mode)
        # The liveness sweeper check needs a database (it seeds a runtime
        # row with a stale heartbeat) and waits for a sweep tick, so this
        # suite only runs in DB mode.
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/runtime_e2e.sh

      - name: E2E — smoke (DB mode)
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/smoke_test.sh

      - name: E2E — CLI daemon (WebSocket handshake, hostname)
        # The CLI's default server_url is http://localhost:8080, so the
        # daemon's WebSocket client must resolve hostnames, not just IP
        # literals. This script points at a hostname on purpose.
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/cli_m2_e2e.sh

      - name: E2E — CLI daemon resilience (survives a server outage)
        # The daemon used to die on the first claim attempt after the
        # server went away, so every server restart silently killed it.
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/daemon_resilience_e2e.sh
