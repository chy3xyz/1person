name: zserver CI

# zserver (Zig backend) build + test + migration + e2e gate.
#
# Lives at the repo root because GitHub Actions ignores workflows in
# nested .github directories. zfinal + zcli are Zig package manager git
# deps in backend/zserver/build.zig.zon (fetched by `zig build`).

on:
  push:
    branches: [main]
    paths:
      - "backend/zserver/**"
      - ".github/workflows/zserver-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/zserver/**"
      - ".github/workflows/zserver-ci.yml"
  workflow_dispatch:

concurrency:
  group: zserver-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/zserver
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: 1person
          POSTGRES_USER: 1person
          POSTGRES_PASSWORD: 1person
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 1person -d 1person"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://1person:1person@localhost:5432/1person?sslmode=disable
      PATH: ${{ env.PATH }}:${{ github.workspace }}/.zig
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig (pinned 0.17.0-dev.1567)
        working-directory: ${{ github.workspace }}
        run: |
          bash backend/zserver/scripts/install-zig.sh "${GITHUB_WORKSPACE}/.zig"
          zig version

      - name: Install libpq headers (Postgres client lib)
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Migrations (apply + idempotency)
        run: |
          ./zig-out/bin/zserver migrate
          echo "==> re-run (idempotency check)"
          ./zig-out/bin/zserver migrate

      - name: E2E — issue suite, no-DB mode
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 DATABASE_URL="" \
            bash scripts/issue_e2e.sh

      - name: E2E — issue suite, DB mode
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/issue_e2e.sh

      - name: E2E — smoke (DB mode)
        run: |
          JWT_SECRET=test-secret ONEPERSON_DEV_VERIFICATION_CODE=000000 \
            bash scripts/smoke_test.sh
