name: Mobile Verify

# Runs lint + typecheck for frontend/apps/mobile only, parallel to the main CI
# workflow. Path-filtered so PRs that don't touch mobile (or anything
# mobile transitively depends on) pay zero cost.
#
# Path scope rationale — mobile transitively depends on:
# - frontend/apps/mobile/**       — the app itself
# - frontend/packages/core/**     — mobile imports types AND pure functions
# - frontend/package.json / pnpm-lock.yaml — install graph
# - frontend/pnpm-workspace.yaml  — catalog versions
# - frontend/turbo.json           — turbo task pipeline
#
# Mobile's vitest suite is intentionally narrow (Node env, pure-function
# tests under frontend/apps/mobile/lib/*.test.ts).

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/packages/core/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/turbo.json"
      - ".github/workflows/mobile-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/packages/core/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/turbo.json"
      - ".github/workflows/mobile-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint, and test
        run: pnpm exec turbo typecheck lint test --filter=@1person/mobile
