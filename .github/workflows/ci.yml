name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Test self-host env derivation
        working-directory: ${{ github.workspace }}
        run: bash backend/scripts/selfhost-config.test.sh

      - name: Verify reserved-slugs.ts is up to date
        # Re-runs the generator and fails on any drift from the
        # checked-in TypeScript output. The Zig backend embeds the JSON
        # source directly, so a passing diff here proves both sides
        # share one source of truth.
        working-directory: ${{ github.workspace }}
        run: |
          pnpm generate:reserved-slugs
          git diff --exit-code -- frontend/packages/core/paths/reserved-slugs.ts

      - name: Build, type check, lint, and test
        # Mobile lives in a parallel mobile-verify workflow (path-filtered
        # to frontend/apps/mobile/** + frontend/packages/core/**) so it
        # doesn't add ~50s of expo-lint + tsc to every web/desktop PR.
        run: pnpm exec turbo build typecheck lint test --filter='!@1person/docs' --filter='!@1person/mobile'

  # Backend (zserver) build/test/migrate/e2e coverage lives in
  # .github/workflows/zserver-ci.yml.
  installer:
    # Stub-driven shell tests for backend/scripts/install.sh.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test shell installers
        run: bash backend/scripts/install.test.sh
